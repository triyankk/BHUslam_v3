<!doctype html><html><head><meta charset="utf-8"><title>JT16 local map</title><style>
body{margin:0;background:#101722;color:#e7edf5;font:15px system-ui}header{padding:14px 20px;background:#1b2637}h2{margin:0 0 5px;font-size:21px}p{margin:5px 0;color:#b8c8dc}button,label{margin-right:15px}button{padding:6px 13px;background:#314760;color:white;border:0;border-radius:5px}canvas{display:block;width:100%;height:76vh;touch-action:none}footer{padding:10px 20px;color:#b8c8dc}
</style></head><body><header><h2>JT16-only local map</h2><p id="stats"></p><button id="fit">Fit map</button><button id="top">Top view</button><label><input type="checkbox" id="points" checked>Points</label><label><input type="checkbox" id="path" checked>Trajectory</label><p>Drag to orbit · Shift-drag to pan · Scroll to zoom. Colours show native-frame height.</p></header><canvas id="scene"></canvas><footer>FAST-LIO2 + JT16 built-in IMU. Local coordinates in metres; calibration is provisional. This is a saved local map without loop closure.</footer><script>
const DATA=/*JT16_DATA*/null;
const canvas=document.getElementById('scene'),gl=canvas.getContext('webgl');
if(!gl)throw Error('WebGL is required for this offline viewer');
const shader=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 p;attribute vec3 c;uniform vec3 eye,r,u,f;uniform float aspect,size;varying vec3 color;void main(){vec3 q=p-eye;float d=dot(q,f);gl_Position=vec4(dot(q,r)*1.8/aspect,dot(q,u)*1.8,1.00001*d-0.1,d);gl_PointSize=size;color=c;}`));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.);}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Shader link failed');gl.useProgram(program);
const locations=Object.fromEntries(['eye','r','u','f','aspect','size'].map(n=>[n,gl.getUniformLocation(program,n)])),position=gl.getAttribLocation(program,'p'),colour=gl.getAttribLocation(program,'c');
const points=DATA.points,path=DATA.trajectory.map(p=>p.slice(1,4)),all=points.length?points:path;
let lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of all)p.forEach((v,k)=>{lo[k]=Math.min(lo[k],v);hi[k]=Math.max(hi[k],v)});
let center=lo.map((v,k)=>(v+hi[k])/2),target=center.slice(),baseDistance=Math.max(2,Math.hypot(...hi.map((v,k)=>v-lo[k]))*1.2),distance=baseDistance,yaw=-1.2,pitch=.65;
const makeBuffer=data=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data.flat()),gl.STATIC_DRAW);return b;};
const mapBuffer=makeBuffer(points),mapColour=makeBuffer(points.map(p=>{let t=(p[2]-lo[2])/Math.max(.01,hi[2]-lo[2]);return[.1+.8*t,.85-.35*t,1.-.75*t]})),pathBuffer=makeBuffer(path),pathColour=makeBuffer(path.map(()=>[1,.65,.1]));
const sub=(a,b)=>a.map((v,k)=>v-b[k]),unit=a=>{const n=Math.hypot(...a);return a.map(v=>v/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
let right=[1,0,0],up=[0,0,1];
function draw(){const dpr=Math.min(2,devicePixelRatio||1);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.04,.065,.10,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);const eye=target.map((v,k)=>v+distance*[Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch)][k]),forward=unit(sub(target,eye));right=unit(cross(forward,[0,0,1]));up=cross(right,forward);for(const[n,v]of Object.entries({eye,r:right,u:up,f:forward}))gl.uniform3fv(locations[n],v);gl.uniform1f(locations.aspect,canvas.width/canvas.height);gl.uniform1f(locations.size,2*dpr);
 const render=(pb,cb,n,mode)=>{gl.bindBuffer(gl.ARRAY_BUFFER,pb);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.enableVertexAttribArray(colour);gl.vertexAttribPointer(colour,3,gl.FLOAT,false,0,0);gl.drawArrays(mode,0,n)};
 if(document.getElementById('points').checked)render(mapBuffer,mapColour,points.length,gl.POINTS);if(document.getElementById('path').checked)render(pathBuffer,pathColour,path.length,gl.LINE_STRIP);
}
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];if(e.shiftKey)target=target.map((v,k)=>v+distance*.002*(-dx*right[k]+dy*up[k]));else{yaw-=dx*.007;pitch=Math.max(-1.55,Math.min(1.55,pitch+dy*.007));}draw()};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();distance=Math.max(.1,Math.min(10000,distance*Math.exp(e.deltaY*.001)));draw()};
document.getElementById('fit').onclick=()=>{target=center.slice();distance=baseDistance;draw()};document.getElementById('top').onclick=()=>{pitch=1.55;draw()};for(const id of ['points','path'])document.getElementById(id).onchange=draw;window.onresize=draw;
document.getElementById('stats').textContent=`${points.length.toLocaleString()} map voxels · ${path.length} trajectory poses · ${DATA.summary.clouds_published} input scans · 20 cm display voxels`;draw();
</script></body></html>
